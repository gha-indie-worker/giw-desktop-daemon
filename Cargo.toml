[package]
name = "giw-desktop-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "IndieBuild desktop control plane backed by Scintilla local execution"
repository = "https://github.com/gha-indie-worker/giw-desktop-daemon"

[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
