name: Apply targeted daemon lint fix

on:
  push:
    branches:
      - feat/desktop-control-plane

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/desktop-control-plane
          persist-credentials: true
      - name: Make bad-request helper live
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/ApiError::not_found\("desktop manifest has no Cloudflare tunnel"\)/ApiError::bad_request("desktop manifest has no Cloudflare tunnel")/g' src/main.rs
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'fix: classify missing tunnel config as bad request'
          git push origin HEAD:feat/desktop-control-plane
