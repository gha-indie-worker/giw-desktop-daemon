name: materialize-lock

on:
  push:
    branches:
      - hardening/desktop-control-boundary
    paths:
      - ".github/workflows/materialize-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
      - name: Generate deterministic lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit deterministic Cargo.lock"
          git push origin HEAD:hardening/desktop-control-boundary
